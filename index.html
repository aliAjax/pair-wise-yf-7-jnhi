<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>活字排版工坊</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">本地活字印章排版</p>
          <h1>活字排版工坊</h1>
        </div>
        <div class="top-actions">
          <button id="saveDraftBtn" class="primary">保存草稿</button>
          <button id="exportBtn">导出预览图</button>
          <button id="clearBoardBtn">清空版面</button>
        </div>
      </header>

      <section class="settings-bar" aria-label="版面设置">
        <label>
          纸张
          <select id="paperSize">
            <option value="postcard">明信片</option>
            <option value="bookmark">书签</option>
            <option value="square">方形小笺</option>
          </select>
        </label>
        <label>
          方向
          <select id="flowMode">
            <option value="horizontal">横排</option>
            <option value="vertical">竖排</option>
          </select>
        </label>
        <label>
          网格
          <input id="gridGap" type="range" min="4" max="18" value="8" />
        </label>
        <label>
          作品名
          <input id="workTitle" type="text" placeholder="例：晚风小笺" />
        </label>
      </section>

      <section class="workspace">
        <aside class="panel inventory-panel">
          <div class="panel-head">
            <h2>字模库</h2>
            <span id="inventoryCount"></span>
          </div>
          <form id="typeForm" class="type-form">
            <input id="charInput" maxlength="2" placeholder="字" required />
            <input id="styleInput" placeholder="风格" required />
            <input id="sizeInput" type="number" min="8" max="72" value="24" required />
            <input id="quantityInput" type="number" min="1" max="99" value="3" required />
            <select id="wearInput">
              <option value="新">新</option>
              <option value="微磨">微磨</option>
              <option value="旧痕">旧痕</option>
            </select>
            <button class="primary" type="submit">加入</button>
          </form>
          <div class="filter-row">
            <input id="inventorySearch" type="search" placeholder="搜索字或风格" />
            <select id="styleFilter">
              <option value="all">全部风格</option>
            </select>
          </div>
          <div id="typeList" class="type-list"></div>
        </aside>

        <section class="stage-wrap">
          <div class="status-strip">
            <div>
              <strong id="selectedTypeLabel">未选择字模</strong>
              <span>点击字模后，在版面格子中落字，也可拖拽字模到版面。</span>
            </div>
            <div id="shortageBadge" class="badge ok">数量充足</div>
          </div>
          <div id="stage" class="stage" aria-label="排版画布"></div>
        </section>

        <aside class="panel draft-panel">
          <div class="panel-head">
            <h2>草稿与核对</h2>
            <span id="placedCount"></span>
          </div>
          <div id="usageList" class="usage-list"></div>
          <div class="divider"></div>
          <h3>已保存草稿</h3>
          <div id="draftList" class="draft-list"></div>
        </aside>
      </section>

      <section class="paper-section" aria-label="纸张领用">
        <header class="paper-section-head">
          <div>
            <p class="eyebrow">裁纸间领纸</p>
            <h2>纸张领用</h2>
          </div>
          <p class="paper-rules">
            明信片每张原纸出2张、书签4张、方形小笺3张，换算向上取整。提交先预留库存，撤单归还；开工出库后边角回原批次，已开工不能换批次。
          </p>
        </header>

        <div class="paper-grid">
          <div class="panel paper-panel">
            <div class="panel-head">
              <h3>新开领料</h3>
            </div>
            <form id="requisitionForm" class="paper-form">
              <label>
                草稿
                <select id="paperDraft" required></select>
              </label>
              <label>
                原纸批次
                <select id="paperBatch" required></select>
              </label>
              <label class="paper-pieces-field">
                成品张数
                <input id="paperPieces" type="number" min="1" step="1" value="10" required />
              </label>
              <p id="paperHint" class="paper-calc"></p>
              <button type="submit" class="primary">提交预留</button>
            </form>
            <p id="paperMessage" class="paper-message" role="status"></p>
          </div>

          <div class="panel paper-panel">
            <div class="panel-head">
              <h3>领料记录</h3>
              <span id="requisitionCount"></span>
            </div>
            <div id="requisitionList" class="paper-list"></div>
          </div>

          <div class="panel paper-panel">
            <div class="panel-head">
              <h3>原纸批次</h3>
            </div>
            <form id="batchForm" class="batch-form">
              <input id="batchName" type="text" placeholder="批次名称，例：净皮四尺·丁批" required />
              <input id="batchStock" type="number" min="0" step="1" value="20" placeholder="库存张数" required />
              <button type="submit" class="primary">登记新批次</button>
            </form>
            <div class="divider"></div>
            <div id="batchList" class="paper-list"></div>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
    <script src="paper-convert.js"></script>
    <script src="paper-store.js"></script>
    <script src="paper-ui.js"></script>
  </body>
</html>
